name: XBloom

options:
  bundleIdPrefix: coffee.xbloom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  XBloomCore:
    path: .
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.46.0

targets:
  XBloom:
    type: application
    platform: iOS
    sources:
      - path: XBloomApp
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: XBloomCore
        product: XBloomCore
      - package: Supabase
        product: Supabase
      - target: XBloomLiveActivity
        embed: true
    info:
      path: XBloomApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: xBloom
        CFBundleURLTypes:
          - CFBundleURLName: coffee.xbloom.native
            CFBundleURLSchemes:
              - xbloom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: xBloom uses Bluetooth to connect to your coffee machine, send recipes, and read live brew telemetry.
        NSCameraUsageDescription: xBloom uses the camera to import details from your coffee bean packaging.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Filled in from Secrets.xcconfig, which is not in the repository.
        # Absent, these stay empty and the app runs without a backend.
        SupabaseHost: $(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coffee.xbloom.native
        PRODUCT_NAME: xBloom
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WWJ39PU569
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  XBloomLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: XBloomLiveActivity
        excludes:
          - Info.plist
    dependencies:
      - package: XBloomCore
        product: XBloomCore
    info:
      path: XBloomLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: xBloom Brew
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coffee.xbloom.native.LiveActivity
        PRODUCT_NAME: XBloomLiveActivity
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WWJ39PU569
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  XBloom:
    build:
      targets:
        XBloom: all
    run:
      config: Debug
    archive:
      config: Release
