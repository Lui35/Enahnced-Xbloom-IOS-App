name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push to a branch makes the run in flight for it pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      # The domain and protocol logic is a SwiftPM package, so it needs no
      # project, no simulator, and no signing. This is the fast check.
      - name: Run the XBloomCore test suite
        run: swift test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check and test the AI backend
        run: |
          deno check supabase/functions/coffee-ai/index.ts
          deno test supabase/functions/coffee-ai/handler_test.ts

  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      # XBloom.xcodeproj is generated and gitignored in spirit: regenerating it
      # here also proves project.yml still describes a project that builds.
      # No Supabase project in CI, on purpose: a public build must not carry
      # anybody's backend. The app is fully usable without one — only sync and
      # the AI features need it.
      - name: Create an empty backend configuration
        run: cp Secrets.example.xcconfig Secrets.xcconfig

      - name: Generate the Xcode project
        run: xcodegen generate

      # App-level tests exercise real SwiftData and mocked cloud services, with no provider calls.
      - name: Build and test the app
        run: |
          set -o pipefail
          XBLOOM_TEST_SIMULATOR=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project XBloom.xcodeproj \
            -scheme XBloom \
            -destination "platform=iOS Simulator,id=$XBLOOM_TEST_SIMULATOR" \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tail -60
