name: Release

# Every change that lands on main and could alter the app produces a build you
# can put on a phone. Documentation-only pushes do not: a release whose only
# difference is a paragraph of prose is noise.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ipa:
    name: IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      # The released build carries this repository's own backend, from secrets
      # rather than from the source, so the key can be rotated without a commit
      # and never enters git history.
      #
      # Understand what this means: the key ends up inside a public IPA, which
      # is the same as publishing it. That is only acceptable because new
      # sign-ups are disabled on the project — the key alone cannot create an
      # account, and without an account it reaches nothing. Turn sign-ups back
      # on and this step has to go.
      #
      # A fork without these secrets gets blanks and a local-only build, which
      # is the right default for anybody who is not this repository.
      - name: Write the backend configuration
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cp Secrets.example.xcconfig Secrets.xcconfig
          if [ -n "$SUPABASE_HOST" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            {
              echo "SUPABASE_HOST = $SUPABASE_HOST"
              echo "SUPABASE_PUBLISHABLE_KEY = $SUPABASE_PUBLISHABLE_KEY"
            } >> Secrets.xcconfig
            echo "configured=true" >> "$GITHUB_ENV"
          else
            echo "No backend secrets on this repository; building local-only."
            echo "configured=false" >> "$GITHUB_ENV"
          fi

      - name: Generate the Xcode project
        run: xcodegen generate

      # Built for a real device, in Release, with signing switched off. A
      # signed build would need this repository to hold a distribution
      # certificate and a provisioning profile, which is a poor trade for an
      # app everybody installs under their own Apple ID anyway.
      - name: Build for device, unsigned
        run: |
          set -o pipefail
          xcodebuild build \
            -project XBloom.xcodeproj \
            -scheme XBloom \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tail -40

      # An .ipa is a zip with the .app inside a Payload directory. That is the
      # whole format; the rest of what Xcode's exporter does is signing.
      - name: Package the IPA
        id: package
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "No .app was produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          NAME="xBloom-build-${{ github.run_number }}-unsigned.ipa"
          zip -qry "$NAME" Payload
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          SHA="$(git rev-parse --short HEAD)"
          SUBJECT="$(git log -1 --pretty=%s)"
          cat > notes.md <<NOTES
          **$SUBJECT**

          Built from \`$SHA\` on \`main\`.

          ### What is in this build

          Sync and the AI features: **${{ env.configured == 'true' && 'configured' || 'not configured — this build is local-only' }}**.
          Brewing, the machine tools and your library work either way; they are
          local and need no account.

          ### Installing this

          This IPA is **unsigned**, on purpose — a signed one would mean keeping
          a distribution certificate in a public repository, and every install
          of this app is under its own Apple ID anyway. Sign it with yours:

          - **[Sideloadly](https://sideloadly.io)** or **[AltStore](https://altstore.io)** —
            point either at the \`.ipa\` and sign in with your Apple ID.
          - Or build from source, which is the supported path:
            [INSTALLATION.md](https://github.com/${{ github.repository }}/blob/main/INSTALLATION.md).

          A free Apple ID gives you seven days before the app needs re-signing.

          Bluetooth, the local library and the recipe editor work immediately.
          Sync and the AI features need a Supabase project of your own — the
          installation guide walks through it.
          NOTES
          gh release create "$TAG" \
            "${{ steps.package.outputs.name }}" \
            --title "Build ${{ github.run_number }} · $SHA" \
            --notes-file notes.md \
            --prerelease
